version: '3.8'

services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - ./kurutemizleme:/var/www/html
    environment:
      # Veritabanı bağlantı ayarları (config.php içerisindeki env değişkenleriyle eşleşir)
      DB_SERVER: db
      DB_USERNAME: root
      DB_PASSWORD: password
      DB_NAME: KuruTemizleme
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: KuruTemizleme
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql

volumes:
  db_data:
